name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Show files
        run: ls -la

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create build_app com.siaf.footballmillionaire FootballMillionaire
          rm -rf build_app/www/*
          cp -r *.js *.html *.css *.png *.jpg *.json build_app/www/ 2>/dev/null || true
          cp config.xml build_app/config.xml
          cd build_app
          cordova platform add android
          cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build_app/platforms/android/app/build/outputs/apk/debug/*.apk
