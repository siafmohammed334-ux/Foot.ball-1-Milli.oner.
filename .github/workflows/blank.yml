name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create build_app com.siaf.footballmillionaire "Football Millionaire"

      - name: Copy game files
        run: |
          mkdir -p build_app/www
          find . -maxdepth 1 -mindepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'build_app' \
            ! -name 'cordova.js' \
            ! -name 'cordova_plugins.js' \
            ! -name 'config.xml' \
            -exec cp -r {} build_app/www/ \;
          cp config.xml build_app/config.xml
          cp icon.png build_app/www/icon.png
          test -f build_app/www/index.html

      - name: Add Android platform
        working-directory: build_app
        run: cordova platform add android

      - name: Build APK
        working-directory: build_app
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-millionaire-apk
          path: build_app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
